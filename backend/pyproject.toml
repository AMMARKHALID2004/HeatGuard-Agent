[project]
name = "heatguard-backend"
version = "0.1.0"
description = "FastAPI orchestrator for the HeatGuard heat-risk agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
]

[tool.uv]
# An application, not a distributable package: `uv sync` should install the dependencies
# without trying to build `app/` as a wheel.
package = false
